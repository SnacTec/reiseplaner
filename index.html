<style>
/* Layout: Reisetage oben, Karte links, Infospalte rechts (mobil: Karte oben, Infos darunter) */
:root{
  --bg:#f6efe0; --panel:#ffffff; --ink:#13222c; --muted:#566874; --line:#e6dcc3; --soft:#efe6d0;
  --sea:#bfe3ec; --land:#efe5c9; --coast:#a99a72; --route:#d6452a; --warm:#ff7a59; --warm-ink:#ffffff;
  --accent:#0b7d96; --accent-ink:#ffffff; --port:#3a5f78; --danger:#d6452a; --plan:#2468b3;
  --t-sight:#2a6fb8; --t-beach:#d18b0f; --t-nature:#2c8a57; --t-factory:#8a4bb5; --t-town:#5b6b7a;
  --ok:#1f7a4d; --warn:#a85f00; --pick:#1d8a4e;
  --head:'Space Grotesk',system-ui,sans-serif; --body:'Inter',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1920; --panel:#15242d; --ink:#e5eef2; --muted:#9bb0bc; --line:#26404d; --soft:#1d3340;
  --sea:#12303f; --land:#2b3b36; --coast:#566e63; --route:#ff7a5c;
  --accent:#4fc0dc; --accent-ink:#06222b; --port:#9cc0d8; --danger:#ff6a49; --plan:#5aa2ee;
  --t-sight:#6aa8ee; --t-beach:#f0b13a; --t-nature:#4fc489; --t-factory:#c08be6; --t-town:#93a7b6;
  --ok:#59c98f; --warn:#f0b13a; --pick:#2a9d62; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1920; --panel:#15242d; --ink:#e5eef2; --muted:#9bb0bc; --line:#26404d; --soft:#1d3340;
  --sea:#12303f; --land:#2b3b36; --coast:#566e63; --route:#ff7a5c;
  --accent:#4fc0dc; --accent-ink:#06222b; --port:#9cc0d8; --danger:#ff6a49; --plan:#5aa2ee;
  --t-sight:#6aa8ee; --t-beach:#f0b13a; --t-nature:#4fc489; --t-factory:#c08be6; --t-town:#93a7b6;
  --ok:#59c98f; --warn:#f0b13a; --pick:#2a9d62; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--body);display:flex;flex-direction:column;
  padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--head);margin:0;text-wrap:balance}
.top{display:flex;align-items:center;gap:12px 20px;flex-wrap:wrap;padding:10px max(16px,env(safe-area-inset-left,0px)) 8px max(16px,env(safe-area-inset-left,0px));background:var(--panel);border-bottom:1px solid var(--line)}
.top h1{font-size:19px;font-weight:700;letter-spacing:-.01em}
.top .sub{color:var(--muted);font-size:12.5px}
.tot{margin-left:auto;display:flex;align-items:baseline;gap:8px;background:var(--soft);border-radius:8px;padding:5px 12px}
.tot b{font-family:var(--head);font-size:17px;font-variant-numeric:tabular-nums}
.tot span{color:var(--muted);font-size:12px}
.days{display:flex;gap:6px;overflow-x:auto;padding:12px max(16px,env(safe-area-inset-left,0px)) 8px;background:var(--panel);border-bottom:1px solid var(--line);scrollbar-width:thin}
.bdg{position:absolute;top:-9px;right:-9px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:var(--danger);color:#fff;font:700 11.5px/20px var(--head);text-align:center;border:2px solid var(--panel);box-sizing:content-box;font-variant-numeric:tabular-nums;pointer-events:none}
.bdg[hidden]{display:none}
.tbd{position:absolute;bottom:-8px;right:-7px;min-width:18px;height:18px;border-radius:9px;background:var(--plan);color:#fff;font:700 11px/18px var(--head);text-align:center;border:2px solid var(--panel);box-sizing:content-box}
.tbd[hidden]{display:none}
.tmk{display:inline-block;min-width:16px;height:16px;border-radius:8px;background:var(--plan);color:#fff;font:700 10.5px/16px var(--head);text-align:center;margin-left:6px;vertical-align:middle}
.mk .tm{pointer-events:none}
.day{position:relative;flex:0 0 auto;min-width:92px;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:5px 9px;line-height:1.25}
.day small:first-of-type{display:flex;align-items:center;justify-content:space-between;gap:8px}
.st{flex:0 0 auto;width:15px;height:15px;border-radius:50%;border:2px solid var(--muted);opacity:.55;display:inline-grid;place-items:center;color:#fff;font:700 10px/1 var(--head);font-style:normal}
.st.ok{background:var(--plan);border-color:var(--plan);opacity:1}
.day[aria-current="true"] .st:not(.ok){border-color:currentColor;opacity:.8}
.day small{display:block;color:var(--muted);font-size:11px;font-variant-numeric:tabular-nums}
.day b{display:block;font-size:12.5px;font-weight:600;white-space:nowrap}
.day.port{border-left:4px solid var(--port)}
.day.sea{border-left:4px solid var(--muted);opacity:.85}
.day.start,.day.end{border-left:4px solid var(--accent)}
.day[aria-current="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.day[aria-current="true"] small{color:inherit;opacity:.85}
main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(340px,440px)}
.mapcol{position:relative;min-height:0;display:flex;flex-direction:column;background:var(--sea)}
.mbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px 10px;background:var(--panel);border-bottom:1px solid var(--line)}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:3px 10px;font-size:12.5px;display:inline-flex;align-items:center;gap:6px}
.chip i{width:10px;height:10px;border-radius:50%;display:inline-block;background:var(--c,var(--muted))}
.chip[aria-pressed="false"]{opacity:.45}
.chip.btn{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.mbar .sp{flex:1}
#mapwrap{position:relative;flex:1;min-height:0;overflow:hidden;touch-action:none;cursor:grab;background:var(--sea)}
#mapwrap.drag{cursor:grabbing}
#map{position:absolute;inset:0;width:100%;height:100%;display:block}
.reef{fill:none;stroke:#7bbfd0;stroke-width:1;stroke-dasharray:2 3;vector-effect:non-scaling-stroke;opacity:.8}
.urb{fill:#d9c79a;stroke:none;opacity:.75}
.riv{fill:none;stroke:#7fb7d3;stroke-width:1.4;vector-effect:non-scaling-stroke}
.rd2{fill:none;stroke:#fff;stroke-width:1.6;vector-effect:non-scaling-stroke;stroke-linecap:round;stroke-linejoin:round;opacity:.9}
.rd1c{fill:none;stroke:#c98a1e;stroke-width:4.4;vector-effect:non-scaling-stroke;stroke-linecap:round;stroke-linejoin:round}
.rd1{fill:none;stroke:#ffd27a;stroke-width:2.8;vector-effect:non-scaling-stroke;stroke-linecap:round;stroke-linejoin:round}
.plc circle{fill:#6b5a36;stroke:#fff;stroke-width:1;vector-effect:non-scaling-stroke;r:calc(3.4px*var(--u,1))}
.plc text{font:italic 600 calc(12px*var(--u,1)) Inter,sans-serif;font-size:calc(12px*var(--u,1));fill:#4a3d22;paint-order:stroke;stroke:#fff;stroke-width:calc(3px*var(--u,1));stroke-linejoin:round}
.wring{fill:none;stroke:var(--route);stroke-width:1.4;stroke-dasharray:3 6;vector-effect:non-scaling-stroke;opacity:.75}
.wringl{font:700 11px Inter,sans-serif;font-size:calc(11px*var(--u,1));fill:var(--route);paint-order:stroke;stroke:#fff;stroke-width:calc(3px*var(--u,1))}
#mapwrap .note{display:none}
#mbar{display:none}
.card .badge{cursor:pointer}
#fltbtn{position:absolute;left:8px;top:8px;z-index:4;box-shadow:0 1px 4px #0003}
#fltbtn[hidden],#fltpop[hidden]{display:none}
#osmpop[hidden]{display:none}
#osmpop{position:absolute;right:52px;top:8px;z-index:30;width:min(300px,calc(100% - 70px));max-height:calc(100% - 20px);overflow:auto;display:flex;flex-direction:column;align-items:flex-start;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;box-shadow:0 4px 14px #0003}
#osmpop .osmchips{display:flex;flex-wrap:wrap;gap:6px}
#osmpop .chip{padding:5px 10px;font-size:13px}#osmpop .chip small{color:var(--muted);font-size:11px}
#osmpop .osmsw{display:flex;gap:6px;align-items:center;font-size:13px}
#osmbtn[aria-expanded="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
#osmbtn.far{opacity:.6}
#osmbtn.busy{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);opacity:1;animation:osmring 1.2s ease-out infinite}
#osmbtn.busy svg{animation:osmbob 1.2s ease-in-out infinite}
@keyframes osmring{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 70%,transparent)}100%{box-shadow:0 0 0 14px color-mix(in srgb,var(--accent) 0%,transparent)}}
@keyframes osmbob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@media (prefers-reduced-motion:reduce){#osmbtn.busy,#osmbtn.busy svg{animation:none}}
#osmbtn svg{display:block;margin:auto}
#map g.osm{cursor:pointer}
.dkcab{display:flex;gap:8px;align-items:center}

<script>
/* ---------- Lader: Anmeldung, Reisedaten aus Firestore holen, dann app.js starten ----------
   Aufbau in Firestore (siehe docs/DATEN.md):
     config/app                  { activeTrip }
     trips/<id>                  { title, kind, start, end, people, ship, tz, region, json: "<ports, maps, src, kul, quiz>" }
     trips/<id>/photos/<code>    { d: "data:image/..." }
     ships/<id>                  { name, short, deckNote, json: "<deckplan>", drinks: "<getränkekarte>" }
   Test ohne Firebase: window.__TEST_TRIP (gleiches Format wie die Import-Datei) vor dem Laden setzen. */
(function(){
  const de=document.documentElement;
  const gate=(html)=>{let g=document.getElementById('gate');if(!g){g=document.createElement('div');g.id='gate';document.body.appendChild(g)}
    g.innerHTML='<div class="gbox" role="dialog" aria-modal="true"><h1>Reiseplaner</h1>'+html+'</div>';de.classList.add('gated');de.classList.remove('boot');return g};
  const ungate=()=>{const g=document.getElementById('gate');if(g)g.remove();de.classList.add('boot')};
  const fail=(t)=>gate('<p class="bad">'+t+'</p><button onclick="location.reload()">Neu laden</button>');
  // Import-Datei -> Struktur für app.js
  const fromFile=o=>({id:o.id,trip:o.trip,shipName:o.ship&&o.ship.name,shipNote:o.ship&&o.ship.deckNote,
    D:{ports:o.data.ports,maps:o.data.maps,src:o.data.src,route:o.data.route||null,photos:o.photos||{}},KUL:o.data.kul||{L:{},P:{}},QUIZ:o.data.quiz||[],INFO:o.data.info||{},NOTES:o.data.notes||[],
    SHIP:o.ship?o.ship.data:{dk:[],cab:{},lifts:{}},DRINKS:o.ship?o.ship.drinks:{groups:[]}});
  /* Reisedaten-Kopie auf dem Gerät (IndexedDB rp-cache): Start ohne Warten aufs Netz */
  const cdb=()=>new Promise(res=>{try{const r=indexedDB.open('rp-cache',1);r.onupgradeneeded=()=>r.result.createObjectStore('trip');r.onsuccess=()=>res(r.result);r.onerror=()=>res(null)}catch(e){res(null)}});
  const cget=async k=>{const db=await cdb();if(!db)return null;return new Promise(res=>{try{const q=db.transaction('trip').objectStore('trip').get(k);q.onsuccess=()=>res(q.result||null);q.onerror=()=>res(null)}catch(e){res(null)}})};
  const cput=async(k,v)=>{const db=await cdb();if(!db)return;try{db.transaction('trip','readwrite').objectStore('trip').put(v,k)}catch(e){}};
  // nach dem Bearbeiten: Kopie verwerfen, damit der nächste Start den neuen Stand (auch offline aus dem Firestore-Speicher) lädt
  window.__dropCopy=async k=>{const db=await cdb();if(!db)return;await new Promise(res=>{try{const t=db.transaction('trip','readwrite');t.objectStore('trip').delete(k);t.oncomplete=res;t.onerror=res}catch(e){res()}})};
  const ls=(k,v)=>{try{if(v===undefined)return localStorage.getItem(k);if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,v)}catch(e){return null}};
  let started=false;
  async function start(T){
    if(started)return;started=true;window.__T=T;
    // Reise ohne eigene Karte (Assistent): Übersichtskarte aus der Weltkarte erzeugen
    if(T.D&&(!T.D.maps||!T.D.maps.ov)){try{await new Promise((ok,no)=>{if(window.RP_MAPGEN)return ok();const s=document.createElement('script');s.src='mapgen.js';s.onload=ok;s.onerror=no;document.head.appendChild(s)});
      const wd=await (await fetch('world.json')).json();RP_MAPGEN(T.D,wd)}catch(e){return fail('Die Weltkarte konnte nicht geladen werden. Bitte einmal mit Internet öffnen.')}}
    let code;try{const r=await fetch('app.js',{cache:'no-cache'});if(!r.ok)throw 0;code=await r.text()}catch(e){return fail('Die App konnte nicht geladen werden. Bitte mit Internet neu laden.')}
    const s=document.createElement('script');s.textContent=code;document.body.appendChild(s);
  }
  if(window.__TEST_TRIP){start(fromFile(window.__TEST_TRIP));return}
  const cfg=window.FIREBASE_CONFIG;
  if(!window.firebase||!cfg||!cfg.apiKey)return fail('Keine Verbindung zu Firebase. Bitte mit Internet neu laden.');
  firebase.initializeApp(cfg);
  // App Check: weist bei jeder Anfrage nach, dass sie aus dieser App kommt (unsichtbar, siehe docs/APP-CHECK.md)
  window.__AC={on:false,err:''};if(window.APPCHECK_SITE_KEY){try{if(!firebase.appCheck)throw new Error('Modul nicht geladen');const ac=firebase.appCheck();ac.activate(new firebase.appCheck.ReCaptchaEnterpriseProvider(window.APPCHECK_SITE_KEY),true);window.__AC={on:true,ac,err:''}}catch(e){window.__AC={on:false,err:String(e&&e.message||e)}}}
  const auth=firebase.auth(),db=firebase.firestore();
  const persist=db.enablePersistence({synchronizeTabs:true}).catch(()=>{});
  // erst aus dem Gerätespeicher, sonst vom Server
  const get=async ref=>{try{const s=await ref.get({source:'cache'});if(s.exists!==false&&(!s.docs||s.docs.length))return s}catch(e){}return ref.get()};
  async function signIn(){const p=new firebase.auth.GoogleAuthProvider();p.setCustomParameters({prompt:'select_account'});
    try{await auth.signInWithPopup(p)}catch(e){if(e&&/popup-blocked|operation-not-supported/.test(e.code||'')){try{sessionStorage.setItem('rp-redir','1')}catch(x){}return auth.signInWithRedirect(p)}
      if(e&&!/popup-closed|cancelled-popup/.test(e.code||''))showLogin('Anmeldung fehlgeschlagen: '+(e.code||''))}}
  function showLogin(msg){const g=gate('<p>Bitte mit Google anmelden.</p><button data-in>Mit Google anmelden</button>'+(navigator.onLine===false?'<p class="bad" style="margin:14px 0 0">Keine Internetverbindung. Die erste Anmeldung geht nur online.</p>':'')+(msg?'<p class="bad" style="margin:14px 0 0">'+msg+'</p>':''));g.querySelector('[data-in]').onclick=signIn}
  function showDeny(){const g=gate('<p class="bad">Kein Zugriff für '+((auth.currentUser&&auth.currentUser.email)||'dieses Konto')+'.</p><p>Bitte mit einem freigegebenen Google-Konto anmelden.</p><button data-sw>Anderes Konto wählen</button>');g.querySelector('[data-sw]').onclick=async()=>{await auth.signOut();signIn()}}
  function showImport(msg){
    const g=gate('<p>Noch keine Reise angelegt. Wähle die Import-Datei der Reise (<b>….trip.json</b>).</p><input type="file" accept=".json,application/json" data-f style="margin:6px 0 10px;max-width:100%"><p class="src" data-m>'+(msg||'')+'</p>');
    g.querySelector('[data-f]').onchange=async ev=>{const f=ev.target.files[0];if(!f)return;const m=g.querySelector('[data-m]');
      try{m.textContent='Wird geprüft …';const o=await window.__checkTrip(await f.text(),m);if(!o)return;
        m.textContent='Wird hochgeladen …';await importTrip(o);m.textContent='Fertig.';location.reload()}catch(e){m.textContent='Fehler: '+(e.message||e.code||e)}}}
  /* Import-Datei prüfen (tripcheck.js): Fehler anzeigen, Hinweise bestätigen lassen, korrigierte Fassung zurückgeben */
  window.__checkTrip=async(text,m)=>{if(!window.tripCheck)await new Promise((ok,no)=>{const s=document.createElement('script');s.src='tripcheck.js';s.onload=ok;s.onerror=no;document.head.appendChild(s)});
    const r=tripCheck(text),list=(a,n)=>a.slice(0,n).map(x=>'• '+x).join('\n')+(a.length>n?'\n… und '+(a.length-n)+' weitere':'');
    if(!r.ok){m.style.whiteSpace='pre-line';m.textContent='Die Datei kann so nicht importiert werden:\n'+list(r.errors,12);return null}
    if(!confirm('Reise „'+(r.trip.trip.title||r.trip.id)+'“ importieren?'+(r.warnings.length?'\n\nHinweise:\n'+list(r.warnings,8):'')+(r.fixes.length?'\n\n'+r.fixes.length+' Kleinigkeiten werden automatisch ergänzt.':'')))return null;
    return r.trip};
  async function importTrip(o){ls('rp-trip',o.id);
    const t=Object.assign({},o.trip,{json:JSON.stringify({ports:o.data.ports,maps:o.data.maps,src:o.data.src,route:o.data.route||null,kul:o.data.kul,quiz:o.data.quiz,info:o.data.info,notes:o.data.notes}),updated:Date.now()});
    await db.collection('trips').doc(o.id).set(t);
    for(const [k,v] of Object.entries(o.photos||{}))await db.collection('trips').doc(o.id).collection('photos').doc(k.replace(/\//g,'_')).set({c:k,d:v});
    if(o.ship)await db.collection('ships').doc(o.ship.id).set({name:o.ship.name,short:o.ship.short||'',deckNote:o.ship.deckNote||'',json:JSON.stringify(o.ship.data),drinks:JSON.stringify(o.ship.drinks)});
    await db.collection('config').doc('app').set({activeTrip:o.id},{merge:true});
    try{localStorage.setItem('rp-trip',o.id)}catch(e){}
  }
  window.__importTrip=importTrip;
  // Neue Reise aus dem Assistenten: nur die Reise anlegen, die Standard-Reise der anderen nicht ändern
  // ohne Netz: wird im Gerät gespeichert und automatisch hochgeladen ('offline'), die Reise lässt sich sofort öffnen
  window.__createTrip=async(o,open)=>{const ref=db.collection('trips').doc(o.id),to=(p,ms)=>Promise.race([p,new Promise((_,no)=>setTimeout(()=>no(new Error('offline')),ms))]);
    if(navigator.onLine!==false){const ex=await to(ref.get({source:'server'}),6000).catch(()=>null);if(ex&&ex.exists)throw new Error('Reise-Kennung schon vergeben')}
    const w=ref.set(Object.assign({},o.trip,{json:JSON.stringify(o.data),updated:Date.now()}));let how='ok';try{await to(w,8000)}catch(e){if(e.message!=='offline')throw e;how='offline'}
    if(open)ls('rp-trip',o.id);return how};
  // Alle Reisen für die Auswahl in den Einstellungen
  window.__listTrips=async()=>{const q=await db.collection('trips').get();return q.docs.map(d=>{const x=d.data();return {id:d.id,title:x.title||d.id,start:x.start||'',end:x.end||'',kind:x.kind||''}}).sort((a,b)=>(b.start||'').localeCompare(a.start||''))};
  async function load(){
    // Läuft die App schon (Start aus der Kopie), wird im Hintergrund vom Server geholt
    const G=ref=>started?ref.get({source:'server'}).catch(()=>get(ref)):get(ref);
    try{
      // gewählte Reise: auf diesem Gerät gemerkt, sonst die zuletzt importierte (config/app)
      let mine=null;try{mine=localStorage.getItem('rp-trip')}catch(e){}
      let id=mine,ts=id?await G(db.collection('trips').doc(id)).catch(()=>null):null;
      if(!ts||!ts.exists){const c=await G(db.collection('config').doc('app'));id=c.exists&&c.data().activeTrip;
        if(!id)return showImport();ts=await G(db.collection('trips').doc(id));if(!ts.exists)return showImport('Die aktive Reise „'+id+'“ fehlt.')}
      // läuft schon aus der Kopie und nichts geändert → nichts weiter laden (spart Datenvolumen)
      if(started&&window.__T&&window.__T.id===id&&ts.data().updated===(window.__T.trip||{}).updated)return;
      const t=ts.data(),j=JSON.parse(t.json||'{}');delete t.json;
      let ship=null;if(t.ship){const ss=await G(db.collection('ships').doc(t.ship));if(ss.exists)ship=ss.data()}
      const ph={};const ps=await G(db.collection('trips').doc(id).collection('photos'));ps.docs.forEach(d=>{const x=d.data();ph[x.c||d.id]=x.d});
      const T={id,trip:t,shipName:ship&&ship.name,shipNote:ship&&ship.deckNote,D:{ports:j.ports||[],maps:j.maps||{},src:j.src||{},route:j.route||null,photos:ph},KUL:j.kul||{L:{},P:{}},QUIZ:j.quiz||[],INFO:j.info||{},NOTES:j.notes||[],
        SHIP:ship?JSON.parse(ship.json):{dk:[],cab:{},lifts:{}},DRINKS:ship&&ship.drinks?JSON.parse(ship.drinks):{groups:[]}};
      cput(id,T);ls('rp-lasttrip',id);if(auth.currentUser)ls('rp-uid',auth.currentUser.uid);
      if(started){if(JSON.stringify((window.__T||{}).trip)!==JSON.stringify(t)||Object.keys(ph).length!==Object.keys(((window.__T||{}).D||{}).photos||{}).length)dispatchEvent(new CustomEvent('rp-trip-updated'));return}
      ungate();
      start({id,trip:t,shipName:ship&&ship.name,shipNote:ship&&ship.deckNote,D:{ports:j.ports||[],maps:j.maps||{},src:j.src||{},route:j.route||null,photos:ph},KUL:j.kul||{L:{},P:{}},QUIZ:j.quiz||[],INFO:j.info||{},NOTES:j.notes||[],
        SHIP:ship?JSON.parse(ship.json):{dk:[],cab:{},lifts:{}},DRINKS:ship&&ship.drinks?JSON.parse(ship.drinks):{groups:[]}});
      // im Hintergrund vom Server auffrischen, damit Änderungen beim nächsten Start da sind
      setTimeout(()=>{if(navigator.onLine===false)return;db.collection('trips').doc(id).get({source:'server'}).catch(()=>{});db.collection('trips').doc(id).collection('photos').get({source:'server'}).catch(()=>{});if(t.ship)db.collection('ships').doc(t.ship).get({source:'server'}).catch(()=>{});db.collection('config').doc('app').get({source:'server'}).catch(()=>{})},8000);
    }catch(e){if(e&&e.code==='permission-denied')return showDeny();if(started)return;fail('Reisedaten konnten nicht geladen werden ('+(e&&(e.code||e.message)||'?')+'). Beim ersten Start wird Internet gebraucht.')}
  }
  (async()=>{
    await persist;
    const tid=ls('rp-trip')||ls('rp-lasttrip');
    if(ls('rp-uid')&&tid&&!sessionStorage.getItem('rp-redir')){const T=await cget(tid);if(T&&T.id===tid){ungate();start(T)}}
    if(sessionStorage.getItem('rp-redir')){sessionStorage.removeItem('rp-redir');try{await Promise.race([auth.getRedirectResult(),new Promise(r=>setTimeout(r,8000))])}catch(e){}}
    let first=true;
    auth.onAuthStateChanged(u=>{if(!first)return;if(u){first=false;ls('rp-uid',u.uid);load()}else{ls('rp-uid',null);if(started)return;showLogin()}});
  })();
})();

</script>
